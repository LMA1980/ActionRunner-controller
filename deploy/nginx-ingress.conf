# ==============================================================================
# SpacemiT K3 Ingress, Web UI & GitHub Webhook Configuration (Nginx)
# Location: /etc/nginx/sites-available/k3-webhook
# Symlink:  /etc/nginx/sites-enabled/k3-webhook
# ==============================================================================

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name hook.lma1980.duckdns.org lma1980.duckdns.org;

    # Allow Let's Encrypt HTTP-01 challenges
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS WebHook & Leptos Web UI Ingress
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hook.lma1980.duckdns.org lma1980.duckdns.org;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HTTP Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/k3_webhook_access.log;
    error_log  /var/log/nginx/k3_webhook_error.log;

    root /var/www/action-runner-web;
    index index.html;

    # GitHub WebHook Ingress Endpoint (ActionRunner-controller)
    location /webhook {
        limit_req zone=webhook_limit burst=10 nodelay;
        client_max_body_size 2M;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header X-GitHub-Delivery $http_x_github_delivery;
    }

    # Cluster WebSocket Tunnel (ActionRunner-controller)
    # Uses zerocopy framing and Fory/Arrow streaming
    location /api/cluster/tunnel {
        proxy_pass http://127.0.0.1:8000/api/cluster/tunnel;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API & Queue Monitor Endpoints
    location ~ ^/(api|queue|health) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dynamic Factory Scorecards & Status Badges
    location ~ ^/(cards|badges)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600, s-maxage=3600";
    }

    # Jobs endpoint: if JSON is requested, proxy to Controller API; otherwise serve Web UI
    location /jobs {
        if ($http_accept ~* "application/json") {
            proxy_pass http://127.0.0.1:8000;
            break;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # Static Assets: WebAssembly binaries, JS modules, CSS stylesheets, and type definitions
    location ~* \.(?:wasm|js|css|d\.ts)$ {
        etag on;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Static Assets: images, SVGs, icons
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        etag on;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ActionRunner-web Leptos WASM SPA HTML Entry Point & Client Route Fallback
    # NEVER cache index.html so browsers immediately discover new asset versions
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
