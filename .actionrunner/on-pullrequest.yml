version: "2"
name: "ActionRunner-controller Factory Pipeline: Formatting, Clippy, Audit & Coverage"

stages:
  - id: fmt-check
    name: "Verify Rust Formatting"
    tags: ["fmt"]
    threads: 2
    run: "cargo fmt --check"

  - id: clippy-check
    name: "Verify Rust Linter & Clippy Rules"
    tags: ["clippy"]
    depends_on: ["fmt-check"]
    threads: 4
    run: "cargo clippy --all-targets -- -D warnings"

  - id: audit-check
    name: "Verify Dependencies Security Advisories"
    tags: ["audit"]
    depends_on: ["fmt-check"]
    threads: 2
    run: "cargo generate-lockfile && cargo audit"

  - id: coverage-check
    name: "Evaluate Test Suite & Line Code Coverage (cargo llvm-cov)"
    tags: ["build", "test"]
    depends_on: ["clippy-check", "audit-check"]
    threads: 4
    run: "cargo llvm-cov --lib --bins --summary-only"
