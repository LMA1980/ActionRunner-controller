[package]
name = "mu-ci-controller"
version = "0.1.0"
edition = "2021"
description = "WebAPI, Ingress, DAG Stage Scheduler, and SVG Scorecard Controller for the Distributed Mu-CI Platform"
license = "AGPL-3.0-only"
repository = "https://github.com/LMA1980/mu-ci-controller"

[features]
default = []
bundled-duckdb = []

[dependencies]
mu-ci-ipc = { git = "https://github.com/LMA1980/mu-ci-ipc.git", branch = "feat/m8-naming-alignment" }
mu-ci-tools = { git = "https://github.com/LMA1980/mu-ci-tools.git", branch = "feat/m8-naming-alignment" }
mu-observable-ipc = { git = "https://github.com/LMA1980/mu-observable-ipc.git", branch = "feat/m8-naming-alignment" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "process", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zerocopy = { version = "0.8", features = ["derive"] }
fory = "1.7"
arrow = { version = "54", default-features = false, features = ["ipc"] }
futures-util = "0.3"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-stream = "0.3.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2"
rustls-pki-types = "1"
x509-parser = "0.18"
notify = "6.1"
arc-swap = "1"

[dev-dependencies]
tokio-tungstenite = "0.26"
mu-ci-worker = { git = "https://github.com/LMA1980/mu-ci-worker.git", branch = "feat/m8-naming-alignment" }
tempfile = "3"
rcgen = "0.14"


