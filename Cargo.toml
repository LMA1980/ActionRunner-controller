[package]
name = "mu-ci-controller"
version = "0.1.1"
edition = "2021"
description = "WebAPI, Ingress, DAG Stage Scheduler, and SVG Scorecard Controller for the Distributed Mu-CI Platform"
license = "AGPL-3.0-only"
repository = "https://github.com/LMA1980/mu-ci-controller"

[features]
default = []
bundled-duckdb = []

[dependencies]
mu-auth = { git = "https://github.com/LMA1980/mu-auth.git", rev = "b59f0d1c27ebc0d70d03dc605a80ab11c2b5b951", features = ["github-oauth"] }
mu-ci-ipc = { git = "https://github.com/LMA1980/mu-ci-ipc.git", branch = "main" }
mu-ci-tools = { git = "https://github.com/LMA1980/mu-ci-tools.git", branch = "main" }
mu-observable-ipc = { git = "https://github.com/LMA1980/mu-observable-ipc.git", branch = "main" }
subtle = "2.6"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "process", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zerocopy = { version = "0.8", features = ["derive"] }
fory = "1.7"
arrow = { version = "54", default-features = false, features = ["ipc"] }
futures-util = "0.3"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-stream = "0.3.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2"
rustls-pki-types = "1"
x509-parser = "0.18"
notify = "6.1"
arc-swap = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
bytes = "1"
http = "1"
webauthn-rs-core = "0.6"
base64 = "0.21"

[dev-dependencies]
tokio-tungstenite = "0.26"
mu-ci-worker = { git = "https://github.com/LMA1980/mu-ci-worker.git", branch = "main" }
tempfile = "3"
p256 = "0.14"
serde_cbor_2 = "0.13"
rcgen = "0.14"


