[package]
name = "action-runner-controller"
version = "0.1.0"
edition = "2021"
description = "WebAPI, Ingress, DAG Stage Scheduler, and SVG Scorecard Controller for the Distributed ActionRunner Platform"
license = "AGPL-3.0-only"
repository = "https://github.com/LMA1980/ActionRunner-controller"

[dependencies]
action-runner-ipc = { git = "https://github.com/LMA1980/ActionRunner-ipc.git" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "process"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zerocopy = { version = "0.8", features = ["derive"] }
fory = "1.7"
arrow = { version = "54", default-features = false, features = ["ipc"] }
futures-util = "0.3"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio-tungstenite = "0.26"
action-runner = { git = "https://github.com/LMA1980/ActionRunner-rs.git" }
tempfile = "3"


